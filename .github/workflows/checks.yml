name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.14'
          - os: windows-2022
            python: '3.13'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Isolated backend tests
        run: python -W error -m unittest discover -s tests -p "test_*.py" -v
  frontend-package:
    name: Decky, native Qt and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run test:frontend
      - run: npm run build
      - name: Native build tools and platform dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgl1-mesa-dev libegl1-mesa-dev libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 libxcb-sync1 libwayland-client0 libwayland-cursor0 libwayland-egl1 libgssapi-krb5-2 libbrotli1
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt linux desktop 6.11.2 linux_gcc_64 -O /tmp/companion-qt
      - name: Build and test native C++ and QML
        run: |
          python scripts/build-native.py --qt /tmp/companion-qt/6.11.2/gcc_64 --build /tmp/companion-native --test
          python tests/native_capture.py --exe /tmp/companion-native/legiongo2companion --qt /tmp/companion-qt/6.11.2/gcc_64 --output /tmp/companion-screens
      - name: Bundle matching Qt runtime and notices
        run: |
          python scripts/prepare-native-licenses.py --output /tmp/companion-licenses
          python scripts/bundle-native.py --exe /tmp/companion-native/legiongo2companion --qt /tmp/companion-qt/6.11.2/gcc_64 --licenses /tmp/companion-licenses --output /tmp/companion-runtime
          cp -a /tmp/companion-runtime/. dist/desktop/
          node scripts/check-desktop-build.mjs --runtime
      - run: npm run package -- --check
      - run: npm run package
      - run: python scripts/verify-package.py
      - name: Upload verified experimental plugin ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LegionGo2Companion
          path: LegionGo2Companion-*.zip
          if-no-files-found: error
